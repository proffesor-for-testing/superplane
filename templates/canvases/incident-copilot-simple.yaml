metadata:
  name: "Incident Copilot (Simple)"
  description: "AI-powered incident triage - simplified 3-node version for demo. Trigger → AI Analysis → Slack. No external API dependencies."
  isTemplate: true
spec:
  nodes:
    # ── Trigger ───────────────────────────────────────────────────────────────
    - id: "trigger-incident"
      name: "Manual Trigger"
      type: "TYPE_TRIGGER"
      configuration:
        events: []
      metadata: null
      position:
        x: 400
        "y": 400
      component: null
      blueprint: null
      trigger:
        name: "manual"
      widget: null
      isCollapsed: false
      integration: null
      errorMessage: ""
      warningMessage: ""

    # ── AI Triage ─────────────────────────────────────────────────────────────
    - id: "ai-triage"
      name: "AI Analysis"
      type: "TYPE_COMPONENT"
      configuration:
        model: "claude-opus-4-6"
        systemMessage: "You are an expert SRE incident triage assistant. Analyze the provided context and produce a concise, actionable triage report. Be factual. Do not speculate. Output valid Markdown only."
        prompt: |
          A production incident requires immediate triage. Analyze the following information and provide a structured assessment.

          ## Trigger Data
          {{ $["Manual Trigger"].data }}

          ---

          Output the following sections using these exact headings:

          ## Severity Assessment
          ONE of: P1-Critical / P2-High / P3-Medium / P4-Low — with 1-sentence justification.

          ## What Is Happening
          2–4 bullet points describing the symptoms. Observable facts only.

          ## Likely Root Cause
          Top hypothesis based on the data. Label as hypothesis.

          ## Recommended Actions
          Ordered numbered list. Immediate actions first.

          ## Next Steps
          Who should be notified and what information they need.
      metadata: null
      position:
        x: 900
        "y": 400
      component:
        name: "claude.textPrompt"
      blueprint: null
      trigger: null
      widget: null
      isCollapsed: false
      integration: null
      errorMessage: ""
      warningMessage: ""

    # ── Slack Output ───────────────────────────────────────────────────────────
    - id: "slack-output"
      name: "Post to Slack"
      type: "TYPE_COMPONENT"
      configuration:
        channel: "#incidents"
        text: |
          🚨 *Incident Triage — AI Analysis*

          ---

          {{ $["AI Analysis"].data.text }}

          ---

          _Generated by SuperPlane Incident Copilot_
      metadata: null
      position:
        x: 1400
        "y": 400
      component:
        name: "slack.sendTextMessage"
      blueprint: null
      trigger: null
      widget: null
      isCollapsed: false
      integration: null
      errorMessage: ""
      warningMessage: ""

    # ── Annotations ───────────────────────────────────────────────────────────
    - id: "annotation-simple"
      name: "annotation-simple"
      type: "TYPE_WIDGET"
      configuration:
        color: "yellow"
        height: 280
        text: |
          ### Simple Incident Copilot

          This is a **demo-safe** 3-node version:

          1. **Manual Trigger** — Click to start
          2. **AI Analysis** — Claude analyzes the incident
          3. **Slack Output** — Posts triage report

          **No external APIs required.**

          To run:
          - Click "Manual Trigger" and provide incident details
          - Or use the webhook URL with your incident JSON
      metadata: null
      position:
        x: 350
        "y": 100
      component: null
      blueprint: null
      trigger: null
      widget:
        name: "annotation"
      isCollapsed: false
      integration: null
      errorMessage: ""
      warningMessage: ""

  edges:
    # Trigger → AI
    - sourceId: "trigger-incident"
      targetId: "ai-triage"
      channel: "default"

    # AI → Slack
    - sourceId: "ai-triage"
      targetId: "slack-output"
      channel: "default"
